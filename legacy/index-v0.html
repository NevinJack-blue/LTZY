<!doctype html>

<title>鹈鹕骑行记 · 海边明信片</title>
<style>
:root{color-scheme:light;--paper:#f5edd9;--ink:#193b39;--muted:#435955;--red:#b94432}
*{box-sizing:border-box}body{margin:0;background:#e6ddc6;color:var(--ink);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif;padding:clamp(12px,3vw,42px) 12px}
main{margin:auto;max-width:1020px;background:var(--paper);padding:clamp(14px,3vw,38px);box-shadow:0 12px 36px #34291324}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{align-items:end;margin-bottom:18px}
.kicker{font:700 13px/1.5 system-ui;letter-spacing:.2em;color:var(--red);margin:0 0 6px}h1{font-family:"Songti SC",SimSun,serif;font-size:clamp(36px,6vw,74px);line-height:1.12;margin:0;letter-spacing:.02em}header span{font-family:Georgia,serif;font-style:italic;color:var(--muted)}
.scene{display:block;width:100%;height:auto;background:#f0cf92;overflow:hidden}footer{margin-top:16px}footer p{margin:0;color:var(--muted)}
button{color:var(--ink);background:transparent;border:1px solid currentColor;border-radius:999px;padding:8px 15px;min-height:44px;display:inline-flex;align-items:center;gap:8px;font:600 15px/1.45 system-ui,"Microsoft YaHei",sans-serif;cursor:pointer}button[hidden]{display:none}button:hover{background:#e5dcc4}button:focus-visible{outline:3px solid var(--red);outline-offset:3px}button svg{width:16px;height:16px;fill:currentColor}.play{display:none}[data-paused] .pause{display:none}[data-paused] .play{display:block}
.wheel,.crank{transform-box:view-box;animation:turn 1.25s linear infinite}.rear{transform-origin:319px 361px}.front{transform-origin:598px 361px}.crank{transform-origin:439px 365px;animation-duration:1.7s}
.bird{animation:bob .85s ease-in-out infinite alternate}.wind{animation:gust 2.5s ease-in-out infinite}.road{animation:roll 1.25s linear infinite}.scarf{transform-box:view-box;transform-origin:475px 226px;animation:flutter .6s ease-in-out infinite alternate}
[data-paused] *{animation-play-state:paused!important}
@keyframes turn{to{transform:rotate(360deg)}}@keyframes bob{to{transform:translateY(-3px)}}@keyframes gust{0%,100%{opacity:.24;transform:translateX(11px)}50%{opacity:.75;transform:translateX(-12px)}}@keyframes roll{to{stroke-dashoffset:132}}@keyframes flutter{to{transform:rotate(-5deg)}}
@media(prefers-reduced-motion:reduce){html:not([data-motion]) *{animation-play-state:paused!important}}
@media(max-width:540px){.scene{width:100%;aspect-ratio:1.16;object-fit:cover}header{display:block}header span{display:block;margin-top:8px}footer{align-items:start}}
</style>
</head>

<footer><p>海风顺路，今天不赶时间。</p><button type="button" id="toggle" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path class="pause" d="M4 2h3v12H4zm5 0h3v12H9z"/><path class="play" d="m5 2 9 6-9 6z"/></svg><span>暂停骑行</span></button></footer>
</main>
<script>
const page = document.documentElement;
const button = document.querySelector('#toggle');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function setPaused(paused) {
  page.toggleAttribute('data-paused', paused);
  button.querySelector('span').textContent = paused ? '继续骑行' : '暂停骑行';
}
setPaused(reducedMotion.matches);
button.hidden = false;
button.addEventListener('click', () => {
  page.setAttribute('data-motion', 'chosen');
  setPaused(!page.hasAttribute('data-paused'));
});
reducedMotion.addEventListener('change', event => {
  page.removeAttribute('data-motion');
  setPaused(event.matches);
});
</script>
